<script>

let slideshowImages = [];
let currentImage = 0;
let slideshowTimer;
let slideshowPaused = false;

const imageElement = document.getElementById("slideshow-image");
const counterElement = document.getElementById("slideshow-counter");
const pauseButton = document.getElementById("pause-button");


let currentReunion = "10th_Reunion";

function loadReunion(reunion) {

    currentReunion = reunion;

    fetch("slideshows/" + reunion + ".json")
        .then(response => response.json())
        .then(images => {

            slideshowImages = images;

            if (slideshowImages.length > 0) {
                showImage(0);
            }

        })
        .catch(error => {
            console.error("Could not load slideshow:", error);
            counterElement.textContent = "Unable to load reunion photos.";
        });
}


// Load the 10th Reunion when the page opens
loadReunion("10th_Reunion");

// Display an image
function showImage(index) {

    currentImage = index;

    const filename = slideshowImages[currentImage];

    console.log("Reunion:", currentReunion);
    console.log("Filename:", filename);
    console.log("Image path:", "slideshows/" + currentReunion + "/" + encodeURIComponent(filename));

    imageElement.src = "slideshows/" + currentReunion + "/" + encodeURIComponent(filename);

    counterElement.textContent =
        (currentImage + 1) + " of " + slideshowImages.length;
}


// Next image
function nextImage() {

    currentImage++;

    if (currentImage >= slideshowImages.length) {
        currentImage = 0;
    }

    showImage(currentImage);
}


// Previous image
function previousImage() {

    currentImage--;

    if (currentImage < 0) {
        currentImage = slideshowImages.length - 1;
    }

    showImage(currentImage);
}


// Start automatic slideshow
function startSlideshow() {

    slideshowTimer = setInterval(function() {

        if (!slideshowPaused) {
            nextImage();
        }

    }, 5000);

}


// Pause / resume
pauseButton.addEventListener("click", function() {

    slideshowPaused = !slideshowPaused;

    pauseButton.textContent =
        slideshowPaused ? "Play" : "Pause";

});


// Button controls
document.getElementById("next-button")
    .addEventListener("click", nextImage);

document.getElementById("previous-button")
    .addEventListener("click", previousImage);

</script>
